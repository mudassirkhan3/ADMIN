<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <title>THE GIRL HE NEVER FORGOT ❤️</title>
    <style>
        /* ==========================================================================
           1. CINEMA VIEWPORT & TYPOGRAPHY VARIABLES
           ========================================================================== */
        :root {
            --bg-cinema: #05060a;
            --gold-accent: #f4c987;
            --rose-accent: #e89999;
            --text-ivory: #faf6f0;
            --font-serif: "Georgia", "Times New Roman", "Palatino Linotype", serif;
            --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-cinema);
            color: var(--text-ivory);
            font-family: var(--font-sans);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           2. EXACT 9:16 VERTICAL FILM STAGE (1080x1920 SAFE COMPOSITION)
           ========================================================================== */
        .cinema-stage {
            position: relative;
            width: 100dvw;
            height: 100dvh;
            background-color: #000000;
            overflow: hidden;
            cursor: pointer;
        }

        @media (min-width: 540px) {
            .cinema-stage {
                width: auto;
                height: 96dvh;
                aspect-ratio: 9 / 16;
                border-radius: 24px;
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 32px 80px rgba(0, 0, 0, 0.96);
            }
        }

        #film-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Subtle film vignette & letterbox soft fade */
        .film-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 44%, transparent 54%, rgba(4, 5, 10, 0.56) 100%),
                linear-gradient(to bottom, rgba(4, 5, 10, 0.48) 0%, transparent 16%, transparent 66%, rgba(4, 5, 10, 0.88) 100%);
            z-index: 5;
        }

        /* ==========================================================================
           3. MINIMAL TOP 6-SEGMENT PROGRESS BAR & AUDIO TOGGLE
           ========================================================================== */
        .top-hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            right: 14px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            width: 100%;
        }

        .progress-segment {
            height: 3px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e7b878, #fff1d6);
            box-shadow: 0 0 8px rgba(244, 201, 135, 0.85);
            border-radius: 999px;
            will-change: width;
        }

        .hud-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px;
        }

        .pause-pill {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(10, 12, 18, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 5px 11px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .pause-pill.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .audio-btn {
            pointer-events: auto;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(10, 12, 18, 0.48);
            color: var(--text-ivory);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .audio-btn:active {
            transform: scale(0.92);
        }

        .audio-btn.playing {
            border-color: rgba(244, 201, 135, 0.65);
            box-shadow: 0 0 14px rgba(244, 201, 135, 0.28);
        }

        /* ==========================================================================
           4. INSTAGRAM SAFE-ZONE SUBTITLES & ENDING OVERLAY
           ========================================================================== */
        .subtitle-safe-zone {
            position: absolute;
            left: 24px;
            right: 24px;
            /* Positioned safely above Instagram Reels bottom UI (caption/audio bar) */
            bottom: max(126px, calc(env(safe-area-inset-bottom) + 114px));
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .story-line {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: clamp(1.12rem, 4.4vw, 1.42rem);
            font-weight: 400;
            line-height: 1.42;
            letter-spacing: 0.015em;
            color: var(--text-ivory);
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.96), 0 0 4px rgba(0, 0, 0, 0.8);
            max-width: 92%;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.75s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .story-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .ending-prompt {
            font-family: var(--font-sans);
            font-size: clamp(0.88rem, 3.5vw, 1.04rem);
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: 0.02em;
            color: #f8dfb4;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
            max-width: 88%;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.85s ease, transform 0.85s ease;
        }

        .ending-prompt.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .replay-btn {
            pointer-events: auto;
            margin-top: 6px;
            padding: 10px 22px;
            border-radius: 999px;
            border: 1px solid rgba(244, 201, 135, 0.55);
            background: rgba(14, 16, 24, 0.72);
            color: var(--text-ivory);
            font-family: var(--font-sans);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.65);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(0.96);
            transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s ease, background 0.2s ease;
        }

        .replay-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .replay-btn:active {
            transform: scale(0.94);
            background: rgba(244, 201, 135, 0.22);
        }
    </style>
</head>
<body>
    <main class="cinema-stage" id="cinema-stage" aria-label="The Girl He Never Forgot - Animated Short Film">
        <canvas id="film-canvas"></canvas>
        <div class="film-vignette"></div>

        <!-- Minimal Top Progress Indicator & Audio Control -->
        <header class="top-hud">
            <div class="progress-grid" aria-hidden="true">
                <div class="progress-segment"><div class="progress-fill" data-seg="0"></div></div>
                <div class="progress-segment"><div class="progress-fill" data-seg="1"></div></div>
                <div class="progress-segment"><div class="progress-fill" data-seg="2"></div></div>
                <div class="progress-segment"><div class="progress-fill" data-seg="3"></div></div>
                <div class="progress-segment"><div class="progress-fill" data-seg="4"></div></div>
                <div class="progress-segment"><div class="progress-fill" data-seg="5"></div></div>
            </div>
            <div class="hud-controls-row">
                <div class="pause-pill" id="pause-pill">Paused</div>
                <button class="audio-btn" id="audio-btn" type="button" aria-label="Toggle Romantic Music" title="Toggle Music">
                    <svg id="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                    <svg id="icon-sound" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Instagram Safe-Area Cinematic Subtitles & Replay -->
        <section class="subtitle-safe-zone" aria-live="polite">
            <p class="story-line" id="story-line"></p>
            <p class="ending-prompt" id="ending-prompt">Have you ever missed someone you never got to say goodbye to? ❤️</p>
            <button class="replay-btn" id="replay-btn" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                <span>Replay Film</span>
            </button>
        </section>
    </main>

    <script>
        /**
         * ==========================================================================
         * "THE GIRL HE NEVER FORGOT" ❤️ — 30-SECOND CINEMATIC ANIMATION ENGINE
         * Resolution: 1080 x 1920 (9:16 Vertical Film Frame)
         * Continuity:
         *   - Boy: Tousled dark-brown hair, charcoal wool overcoat, warm taupe scarf
         *   - Girl: Wavy chestnut-brown hair, cream knit turtleneck, camel trench coat
         * ==========================================================================
         */
        (function () {
            'use strict';

            const W = 1080;
            const H = 1920;
            const TOTAL_DURATION = 30.0; // Exact 30-second runtime
            const SCENE_LEN = 5.0;       // 6 scenes x 5s = 30s

            const stage = document.getElementById('cinema-stage');
            const canvas = document.getElementById('film-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = W;
            canvas.height = H;

            const segFills = Array.from(document.querySelectorAll('.progress-fill'));
            const storyLineEl = document.getElementById('story-line');
            const endingPromptEl = document.getElementById('ending-prompt');
            const replayBtn = document.getElementById('replay-btn');
            const pausePill = document.getElementById('pause-pill');
            const audioBtn = document.getElementById('audio-btn');
            const iconMuted = document.getElementById('icon-muted');
            const iconSound = document.getElementById('icon-sound');

            // ======================================================================
            // 1. ROMANTIC SCORE ENGINE (LOCAL ./music.mp3 + WEB AUDIO PIANO/STRINGS)
            // ======================================================================
            const RomanticAudio = {
                ctx: null,
                isPlaying: false,
                mp3Audio: null,
                useMp3: false,
                schedulerId: null,
                step: 0,

                initMp3Check() {
                    try {
                        const audio = new Audio('./music.mp3');
                        audio.loop = true;
                        audio.volume = 0.65;
                        audio.addEventListener('canplaythrough', () => {
                            this.mp3Audio = audio;
                            this.useMp3 = true;
                        }, { once: true });
                        audio.addEventListener('error', () => {
                            this.useMp3 = false;
                        }, { once: true });
                    } catch (_) {
                        this.useMp3 = false;
                    }
                },

                toggle() {
                    if (this.isPlaying) {
                        this.stop();
                    } else {
                        this.start();
                    }
                },

                start() {
                    if (this.isPlaying) return;
                    this.isPlaying = true;
                    audioBtn.classList.add('playing');
                    iconMuted.style.display = 'none';
                    iconSound.style.display = 'block';

                    if (this.useMp3 && this.mp3Audio) {
                        this.mp3Audio.play().catch(() => {
                            this.useMp3 = false;
                            this.startSynth();
                        });
                    } else {
                        this.startSynth();
                    }
                },

                stop() {
                    this.isPlaying = false;
                    audioBtn.classList.remove('playing');
                    iconMuted.style.display = 'block';
                    iconSound.style.display = 'none';

                    if (this.mp3Audio) {
                        this.mp3Audio.pause();
                    }
                    if (this.schedulerId) {
                        clearInterval(this.schedulerId);
                        this.schedulerId = null;
                    }
                },

                restart() {
                    if (this.useMp3 && this.mp3Audio) {
                        this.mp3Audio.currentTime = 0;
                    }
                    this.step = 0;
                },

                startSynth() {
                    try {
                        if (!this.ctx) {
                            const AudioCtx = window.AudioContext || window.webkitAudioContext;
                            this.ctx = new AudioCtx();
                        }
                        if (this.ctx.state === 'suspended') {
                            this.ctx.resume();
                        }
                    } catch (_) {
                        return;
                    }

                    // Emotional F Major / D Minor arpeggiated piano progression
                    const progression = [
                        // Dm9: D3, A3, E4, F4, A4
                        [146.83, 220.00, 329.63, 349.23, 440.00],
                        // Bbmaj7: Bb2, F3, D4, A4, F4
                        [116.54, 174.61, 293.66, 440.00, 349.23],
                        // Fmaj9: F2, C3, G3, A3, E4
                        [87.31, 130.81, 196.00, 220.00, 329.63],
                        // Csus4 -> C: C3, G3, F4, E4, G4
                        [130.81, 196.00, 349.23, 329.63, 392.00]
                    ];

                    const playPianoNote = (freq, duration, gainPeak, isPad = false) => {
                        if (!this.ctx || !this.isPlaying) return;
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const osc2 = this.ctx.createOscillator();
                        const filter = this.ctx.createBiquadFilter();
                        const gain = this.ctx.createGain();

                        osc.type = isPad ? 'sine' : 'triangle';
                        osc2.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now);
                        osc2.frequency.setValueAtTime(freq * (isPad ? 1.002 : 2.0), now);

                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(isPad ? 680 : 1450, now);
                        filter.frequency.exponentialRampToValueAtTime(320, now + duration);

                        const subGain = this.ctx.createGain();
                        subGain.gain.value = isPad ? 0.35 : 0.14;

                        gain.gain.setValueAtTime(0.0001, now);
                        gain.gain.linearRampToValueAtTime(gainPeak, now + (isPad ? 0.6 : 0.035));
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                        osc.connect(filter);
                        osc2.connect(subGain);
                        subGain.connect(filter);
                        filter.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(now);
                        osc2.start(now);
                        osc.stop(now + duration + 0.05);
                        osc2.stop(now + duration + 0.05);
                    };

                    const tickNote = () => {
                        if (!this.isPlaying) return;
                        const bar = Math.floor(this.step / 5) % progression.length;
                        const noteIdx = this.step % 5;
                        const chord = progression[bar];
                        if (noteIdx === 0) {
                            playPianoNote(chord[0], 3.4, 0.075, true);
                        }
                        playPianoNote(chord[noteIdx], 2.3, noteIdx === 4 ? 0.065 : 0.048, false);
                        this.step++;
                    };

                    tickNote();
                    if (this.schedulerId) clearInterval(this.schedulerId);
                    this.schedulerId = setInterval(tickNote, 560);
                }
            };

            RomanticAudio.initMp3Check();

            audioBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                RomanticAudio.toggle();
            });

            // ======================================================================
            // 2. MATH, EASING & PARTICLE SYSTEMS (LEAVES, RAIN, BOKEH, CLOUDS)
            // ======================================================================
            function clamp(v, min, max) {
                return Math.max(min, Math.min(max, v));
            }

            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            function smoothstep(edge0, edge1, x) {
                const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
                return t * t * (3 - 2 * t);
            }

            function hash(n) {
                const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
                return x - Math.floor(x);
            }

            // Pre-seeded floating autumn leaves
            const leaves = Array.from({ length: 26 }, (_, i) => ({
                x: hash(i * 1.7) * W,
                y: hash(i * 2.9) * H,
                size: 10 + hash(i * 4.1) * 14,
                speedX: 35 + hash(i * 5.3) * 55,
                speedY: 45 + hash(i * 6.7) * 65,
                phase: hash(i * 8.3) * Math.PI * 2,
                hue: i % 2 === 0 ? '#d97724' : '#b84a1e'
            }));

            // Pre-seeded rain streaks for Scene 3
            const raindrops = Array.from({ length: 170 }, (_, i) => ({
                x: hash(i * 3.1) * (W + 300) - 150,
                y: hash(i * 7.3) * H,
                len: 28 + hash(i * 9.1) * 44,
                speed: 1250 + hash(i * 11.3) * 650,
                alpha: 0.16 + hash(i * 13.7) * 0.34,
                width: 1.2 + hash(i * 17.1) * 1.4
            }));

            // Pre-seeded depth-of-field bokeh orbs
            const bokehOrbs = Array.from({ length: 24 }, (_, i) => ({
                x: hash(i * 2.3) * W,
                y: 160 + hash(i * 4.7) * (H - 420),
                r: 18 + hash(i * 6.1) * 56,
                phase: hash(i * 9.7) * Math.PI * 2,
                warm: i % 3 !== 0
            }));

            function drawBokehLayer(ctx, time, opacity, warmTint = true) {
                if (opacity <= 0.01) return;
                ctx.save();
                bokehOrbs.forEach((b, i) => {
                    const driftX = Math.sin(time * 0.4 + b.phase) * 18;
                    const driftY = Math.cos(time * 0.35 + b.phase) * 14;
                    const pulse = 0.65 + 0.35 * Math.sin(time * 1.6 + b.phase);
                    const grad = ctx.createRadialGradient(b.x + driftX, b.y + driftY, 2, b.x + driftX, b.y + driftY, b.r);
                    if (warmTint && b.warm) {
                        grad.addColorStop(0, `rgba(255, 224, 165, ${0.26 * opacity * pulse})`);
                        grad.addColorStop(0.7, `rgba(245, 175, 95, ${0.12 * opacity * pulse})`);
                        grad.addColorStop(1, 'rgba(245, 175, 95, 0)');
                    } else {
                        grad.addColorStop(0, `rgba(195, 225, 255, ${0.22 * opacity * pulse})`);
                        grad.addColorStop(0.7, `rgba(130, 175, 235, ${0.1 * opacity * pulse})`);
                        grad.addColorStop(1, 'rgba(130, 175, 235, 0)');
                    }
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(b.x + driftX, b.y + driftY, b.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            function drawAutumnLeaves(ctx, time, count = 22) {
                ctx.save();
                for (let i = 0; i < count; i++) {
                    const lf = leaves[i];
                    const x = ((lf.x + time * lf.speedX + Math.sin(time * 1.8 + lf.phase) * 35) % (W + 80)) - 40;
                    const y = ((lf.y + time * lf.speedY) % (H + 80)) - 40;
                    const rot = time * 1.9 + lf.phase;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(rot);
                    ctx.fillStyle = lf.hue;
                    ctx.globalAlpha = 0.78;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, lf.size, lf.size * 0.48, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            }

            // ======================================================================
            // 3. CHARACTER CONTINUITY RENDERERS (REALISTIC 3D-SHADED PROPORTIONS)
            // ======================================================================

            /**
             * Renders the Redesigned Hero Boy with modern 3D animated film proportions:
             * - Sculpted jawline & defined chin, straight nose bridge, warm-olive/golden skin shading
             * - Multi-layered deep hazel-amber eyes with dual catchlights & tapered expressive brows
             * - Dark-navy/charcoal tousled layered hair with swept-side bangs & specular strands
             * - Tailored dark charcoal-navy wool coat, slate-grey turtleneck & warm camel-brown scarf
             */
            function drawBoy(ctx, opts) {
                const {
                    x, y,
                    scale = 1,
                    walkPhase = 0,       // 0 = standing, >0 = walking cycle
                    headTurn = 0,        // -1 (left) to +1 (right)
                    headTilt = 0,        // radians (+ = looking down, - = looking up)
                    expression = 'neutral', // 'neutral', 'awe', 'smile', 'sad', 'peaceful'
                    blink = 0,           // 0 = open, 1 = closed
                    armMode = 'walk',    // 'walk', 'umbrella', 'holdingClosedUmbrella'
                    wind = 0,
                    rimLight = 'rgba(255, 215, 155, 0.65)'
                } = opts;

                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);

                const breath = Math.sin(wind * 2.2) * 2.4;
                const walkBob = walkPhase > 0 ? Math.abs(Math.sin(walkPhase)) * 7 : 0;
                const stride = walkPhase > 0 ? Math.sin(walkPhase) * 24 : 0;

                ctx.translate(0, -walkBob);

                // Soft ground contact shadow
                const shadowGrad = ctx.createRadialGradient(0, 295, 8, 0, 295, 85);
                shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.48)');
                shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.ellipse(0, 295, 82, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                // --- LEGS & TAILORED CHARCOAL-NAVY TROUSERS ---
                ctx.fillStyle = '#141924';
                ctx.beginPath();
                ctx.roundRect(-24 - stride * 0.6, 145, 22, 145, 10);
                ctx.fill();

                ctx.fillStyle = '#1c2333';
                ctx.beginPath();
                ctx.roundRect(4 + stride * 0.6, 145, 22, 145, 10);
                ctx.fill();

                // Leather dress boots
                ctx.fillStyle = '#100e12';
                ctx.beginPath();
                ctx.roundRect(-28 - stride * 0.6, 282, 32, 14, 6);
                ctx.roundRect(2 + stride * 0.6, 282, 34, 14, 6);
                ctx.fill();

                // --- TAILORED CHARCOAL-NAVY WOOL OVERCOAT ---
                const coatGrad = ctx.createLinearGradient(-58, -22, 58, 198);
                coatGrad.addColorStop(0, '#2c364a');
                coatGrad.addColorStop(0.5, '#1d2433');
                coatGrad.addColorStop(1, '#11151f');

                const coatSway = Math.sin(wind * 3.1) * 5;
                ctx.fillStyle = coatGrad;
                ctx.beginPath();
                ctx.moveTo(-45, -12 + breath);
                ctx.quadraticCurveTo(-59, 85, -63 - coatSway, 196);

                ctx.bezierCurveTo(25, -80, 34, -52, 30 + hairWave * 0.4, -2);
                ctx.bezierCurveTo(26 + hairWave * 0.5, 26, 16 + hairWave * 0.5, 48, 26 + hairWave * 0.65, 66);
                ctx.bezierCurveTo(39 + hairWave * 0.65, 42, 41, -28, 30, -66);
                ctx.closePath();
                ctx.fill();

                // Delicate wispy center bangs
                ctx.beginPath();
                ctx.moveTo(-12, -74);
                ctx.quadraticCurveTo(-8 + hairWave * 0.25, -56, -13 + hairWave * 0.3, -47);
                ctx.quadraticCurveTo(-4, -57, -1 + hairWave * 0.2, -46);
                ctx.quadraticCurveTo(4, -58, 10 + hairWave * 0.3, -48);
                ctx.quadraticCurveTo(12, -62, 8, -74);
                ctx.closePath();
                ctx.fill();

                // Golden crown rim-light sheen
                ctx.strokeStyle = rimLight;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(-26, -64);
                ctx.quadraticCurveTo(0, -84, 26, -64);

                ctx.restore();

            // ======================================================================

            // SCENE 1 (0–5s): THE FIRST SIGHT (Golden Hour City Street & Café Window)

                // Glass window mullions & diagonal reflection sheen
                ctx.strokeStyle = '#2d1c14';

            // SCENE 2 (5–10s): THE LITTLE MOMENTS (Two Smoothly Blended Montage Shots)

                    // Park lawn & pathway
                    ctx.fillStyle = '#38523c';
                    ctx.fillRect(0, 960, W, 380);
                    ctx.fillStyle = '#47423e';

                    ctx.fillStyle = '#6b4226';
                    ctx.fillRect(140, 1110, 800, 24);
                    ctx.fillRect(140, 1185, 800, 22);
                    ctx.fillStyle = '#24272e';
                    ctx.fillRect(175, 1110, 16, 180);

            // SCENE 3 (10–15s): THE RAIN (Rainy Evening & Offering His Umbrella)
            function renderScene3(ctx, localT, globalT) {
                const zoom = 1.0 + localT * 0.018;
                ctx.save();
                ctx.translate(W * 0.5, H * 0.5);
                ctx.scale(zoom, zoom);
                ctx.translate(-W * 0.5, -H * 0.5);

                // Moody rainy blue-hour twilight sky
                const sky = ctx.createLinearGradient(0, 0, 0, H);
                sky.addColorStop(0, '#0a1526');

                sky.addColorStop(1, '#090f1a');

                ctx.fillRect(-50, -50, W + 100, H + 100);

                // Warm glowing vintage streetlamp halo
                const lampX = 210, lampY = 580;
                ctx.strokeStyle = '#1b2230';
                ctx.lineWidth = 14;
                ctx.beginPath();
                ctx.moveTo(lampX, lampY);
                ctx.lineTo(lampX, 1340);

                const lampHalo = ctx.createRadialGradient(lampX, lampY, 8, lampX, lampY, 460);
                lampHalo.addColorStop(0, 'rgba(255, 224, 150, 0.92)');
                lampHalo.addColorStop(0.32, 'rgba(255, 185, 95, 0.34)');
                lampHalo.addColorStop(1, 'rgba(255, 185, 95, 0)');
                ctx.fillStyle = lampHalo;
                ctx.fillRect(0, 120, W, 1200);

                // Wet asphalt road with shimmering golden & blue reflections

                roadGrad.addColorStop(1, '#070b12');

                // Shimmering water reflections on road
                for (let r = 0; r < 22; r++) {
                    const ry = 1330 + r * 26;

                    ctx.fillStyle = r % 2 === 0 ? 'rgba(255, 198, 110, 0.24)' : 'rgba(130, 180, 255, 0.18)';
                    ctx.fillRect(140 + shimmer, ry, 240, 4);
                    ctx.fillRect(620 - shimmer, ry + 8, 220, 3);
                }

                // Boy approaches from left (0 to 2.2s) and extends his dark umbrella over her
                const approach = smoothstep(0.0, 2.2, localT);
                const boyX = lerp(240, 455, approach);
                const walkCycle = (1 - smoothstep(1.8, 2.3, localT)) * localT * 6.2;
                const sharedMoment = smoothstep(2.0, 3.2, localT);

                // Girl standing on right, turning toward him with a warm shy smile
                drawGirl(ctx, {
                    x: 645,
                    y: 1105,
                    scale: 1.34,
                    headTurn: lerp(-0.15, -0.78, sharedMoment),
                    expression: sharedMoment > 0.4 ? 'shySmile' : 'neutral',

                    rimLight: 'rgba(255, 215, 150, 0.65)'
                });

                drawBoy(ctx, {
                    x: boyX,
                    y: 1095,
                    scale: 1.38,
                    walkPhase: walkCycle,
                    headTurn: lerp(0.45, 0.82, sharedMoment),
                    expression: sharedMoment > 0.4 ? 'smile' : 'neutral',
                    armMode: 'umbrella',
                    wind: globalT * 1.3,
                    rimLight: 'rgba(255, 215, 150, 0.65)'
                });

                // Large Dark Canopy Umbrella extending over both characters
                const umbX = lerp(boyX + 45, 565, approach);
                const umbY = 815;
                // Umbrella shaft & J-handle
                ctx.strokeStyle = '#1c222e';
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.moveTo(boyX + 54, 1125);
                ctx.lineTo(umbX, umbY);
                ctx.stroke();

                // Canopy dome
                const umbGrad = ctx.createLinearGradient(umbX - 210, umbY - 95, umbX + 210, umbY + 20);
                umbGrad.addColorStop(0, '#2a3548');
                umbGrad.addColorStop(0.5, '#171e2b');
                umbGrad.addColorStop(1, '#0e131c');
                ctx.fillStyle = umbGrad;
                ctx.beginPath();
                ctx.moveTo(umbX - 215, umbY + 12);
                ctx.quadraticCurveTo(umbX, umbY - 125, umbX + 215, umbY + 12);
                ctx.quadraticCurveTo(umbX + 110, umbY - 8, umbX, umbY + 6);
                ctx.quadraticCurveTo(umbX - 110, umbY - 8, umbX - 215, umbY + 12);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 220, 165, 0.45)';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Diagonal falling rain streaks (skipping dry zone beneath umbrella)
                ctx.save();
                ctx.strokeStyle = 'rgba(205, 228, 255, 0.42)';
                raindrops.forEach((drop) => {
                    const rx = ((drop.x - globalT * 210) % (W + 200) + (W + 200)) % (W + 200) - 100;
                    const ry = (drop.y + globalT * drop.speed) % H;
                    // Keep dry zone underneath the shared umbrella
                    if (rx > umbX - 195 && rx < umbX + 195 && ry > umbY + 10 && ry < 1380) {
                        return;
                    }
                    ctx.globalAlpha = drop.alpha;
                    ctx.lineWidth = drop.width;
                    ctx.beginPath();
                    ctx.moveTo(rx, ry);
                    ctx.lineTo(rx - 10, ry + drop.len);
                    ctx.stroke();
                });
                ctx.restore();

                drawBokehLayer(ctx, globalT, 0.65, true);
                ctx.restore();
            }

            // SCENE 5 (20–25s): THE SECRET NOTE (Close-up of Eyes & Handwritten Note in Old Book)

                ctx.fillStyle = '#fffaf0';
                ctx.beginPath();
                ctx.roundRect(-275, -135, 550, 270, 8);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // Subtle stationery fold crease
                ctx.strokeStyle = 'rgba(180, 155, 125, 0.35)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-265, 0);
                ctx.lineTo(265, 0);
                ctx.stroke();

                // Handwritten cursive message revealing smoothly
                const revealAlpha = smoothstep(0.4, 1.8, localT);
                ctx.globalAlpha = revealAlpha;
                ctx.fillStyle = '#3b281c';
                ctx.font = 'italic 33px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.fillText('“I wanted to tell you...', 0, -34);
                ctx.fillText('you made my ordinary', 0, 24);
                ctx.fillText('days beautiful.”', 0, 82);
                ctx.restore();

                drawBokehLayer(ctx, globalT, 0.7, true);
                ctx.restore();
            }

            // SCENE 6 (25–30s): THE DEEP ENDING (Evening Sky, Peaceful Smile & Memory Silhouette)
            function renderScene6(ctx, localT, globalT) {
                const zoom = 1.0 + localT * 0.015;
                ctx.save();
                ctx.translate(W * 0.5, H * 0.5);
                ctx.scale(zoom, zoom);
                ctx.translate(-W * 0.5, -H * 0.5);

                // Golden-lavender twilight sky
                const sky = ctx.createLinearGradient(0, 0, 0, H);
                sky.addColorStop(0, '#1e2749');
                sky.addColorStop(0.42, '#6b4e71');
                sky.addColorStop(0.75, '#e08e6d');
                sky.addColorStop(1, '#1a1826');
                ctx.fillStyle = sky;
                ctx.fillRect(-50, -50, W + 100, H + 100);

                // Warm horizon glow
                const horizon = ctx.createRadialGradient(540, 1080, 30, 540, 1080, 780);
                horizon.addColorStop(0, 'rgba(255, 215, 155, 0.72)');
                horizon.addColorStop(0.55, 'rgba(235, 145, 125, 0.25)');
                horizon.addColorStop(1, 'rgba(235, 145, 125, 0)');
                ctx.fillStyle = horizon;
                ctx.fillRect(-50, -50, W + 100, H + 100);

                // Evening terrace balustrade & cityscape silhouette
                ctx.fillStyle = '#181a26';
                ctx.fillRect(-50, 1340, W + 100, H - 1280);
                ctx.fillStyle = '#242738';
                ctx.fillRect(-50, 1265, W + 100, 22);

                // Softly shimmering golden memory silhouette of the girl in the distance
                const memPulse = 0.24 + 0.12 * Math.sin(globalT * 2.2);
                ctx.save();
                ctx.globalAlpha = memPulse * smoothstep(0.5, 2.2, localT);
                drawGirl(ctx, {
                    x: 745,
                    y: 1055,
                    scale: 1.15,
                    headTurn: -0.65,
                    expression: 'smile',
                    wind: globalT * 1.1,
                    rimLight: 'rgba(255, 235, 185, 0.9)'
                });
                ctx.restore();

                // Boy standing beneath the evening sky, looking up with a gentle, peaceful smile
                const lookUp = smoothstep(0.4, 2.0, localT);
                drawBoy(ctx, {
                    x: 410,
                    y: 1085,
                    scale: 1.38,
                    headTurn: 0.28,
                    headTilt: -lookUp * 0.14,
                    expression: 'peaceful',
                    blink: (localT > 2.8 && localT < 3.02) ? 1 : 0,
                    wind: globalT * 1.15,
                    rimLight: 'rgba(255, 210, 155, 0.75)'
                });

                drawAutumnLeaves(ctx, globalT, 16);
                drawBokehLayer(ctx, globalT, 0.85, true);
                ctx.restore();
            }

            const sceneRenderers = [
                renderScene1,
                renderScene2,
                renderScene3,
                renderScene4,
                renderScene5,
                renderScene6
            ];

            const sceneCaptions = [
                '“Sometimes, a stranger becomes a memory.”',
                '“They never spoke... but somehow, they understood.”',
                '“One small gesture. A thousand unspoken feelings.”',
                '“Then one day... she was gone.”',
                '“I wanted to tell you... you made my ordinary days beautiful.”',
                '“Some people leave your life... but never leave your heart.”'
            ];

            // ======================================================================
            // 5. TIMELINE SEQUENCER, CROSSFADES, PAUSE & REPLAY CONTROLLER
            // ======================================================================
            let elapsed = 0;
            let isPaused = false;
            let isEnded = false;
            let lastTimestamp = null;
            let activeCaptionIdx = -1;

            function updateSubtitles(t) {
                const idx = Math.min(5, Math.floor(t / SCENE_LEN));
                const localT = t - idx * SCENE_LEN;

                // Fade caption in after 0.35s and fade out gently before scene transition (except final scene)
                const shouldShow = localT >= 0.3 && (idx === 5 || localT <= 4.55);

                if (shouldShow) {
                    if (activeCaptionIdx !== idx) {
                        activeCaptionIdx = idx;
                        storyLineEl.textContent = sceneCaptions[idx];
                    }
                    storyLineEl.classList.add('visible');
                } else {
                    storyLineEl.classList.remove('visible');
                }

                // Final engagement prompt appears at 27.6s
                if (t >= 27.6) {
                    endingPromptEl.classList.add('visible');
                } else {
                    endingPromptEl.classList.remove('visible');
                }

                // Replay button appears cleanly at 29.7s
                if (t >= 29.7) {
                    replayBtn.classList.add('visible');
                } else {
                    replayBtn.classList.remove('visible');
                }
            }

            function renderFrame(t) {
                const clampedT = clamp(t, 0, TOTAL_DURATION);
                const idx = Math.min(5, Math.floor(clampedT / SCENE_LEN));
                const localT = clampedT - idx * SCENE_LEN;

                // Update 6-segment progress bar
                segFills.forEach((fill, sIdx) => {
                    if (sIdx < idx) {
                        fill.style.width = '100%';
                    } else if (sIdx === idx) {
                        const pct = clamp((localT / SCENE_LEN) * 100, 0, 100);
                        fill.style.width = pct.toFixed(2) + '%';
                    } else {
                        fill.style.width = '0%';
                    }
                });

                // Render current scene
                ctx.clearRect(0, 0, W, H);
                sceneRenderers[idx](ctx, localT, clampedT);

                // Smooth 0.65s cinematic crossfade from previous scene at scene boundaries
                const CROSSFADE = 0.65;
                if (idx > 0 && localT < CROSSFADE) {
                    const prevAlpha = 1 - smoothstep(0, CROSSFADE, localT);
                    ctx.save();
                    ctx.globalAlpha = prevAlpha;
                    sceneRenderers[idx - 1](ctx, SCENE_LEN + localT, clampedT);
                    ctx.restore();
                }

                updateSubtitles(clampedT);
            }

            function animationLoop(timestamp) {
                if (lastTimestamp === null) {
                    lastTimestamp = timestamp;
                }

                const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
                lastTimestamp = timestamp;

                if (!isPaused && !isEnded) {
                    elapsed += dt;
                    if (elapsed >= TOTAL_DURATION) {
                        elapsed = TOTAL_DURATION;
                        isEnded = true;
                    }
                }

                // Keep ambient motion gently alive even on final frame after 30s
                const ambientT = isEnded ? TOTAL_DURATION + (timestamp * 0.001) % 60 : elapsed;
                renderFrame(isEnded ? TOTAL_DURATION : elapsed);

                if (isEnded) {
                    ctx.clearRect(0, 0, W, H);
                    renderScene6(ctx, 5.0, ambientT);
                    updateSubtitles(TOTAL_DURATION);
                }

                requestAnimationFrame(animationLoop);
            }

            // Tap stage to pause/resume (helpful when starting Android screen recorder)
            stage.addEventListener('click', () => {
                if (isEnded) return;
                isPaused = !isPaused;
                pausePill.classList.toggle('visible', isPaused);
                if (isPaused && RomanticAudio.isPlaying && RomanticAudio.mp3Audio) {
                    RomanticAudio.mp3Audio.pause();
                } else if (!isPaused && RomanticAudio.isPlaying && RomanticAudio.mp3Audio) {
                    RomanticAudio.mp3Audio.play().catch(() => {});
                }
            });

            // Replay button resets the entire 30-second film seamlessly
            replayBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                elapsed = 0;
                isPaused = false;
                isEnded = false;
                activeCaptionIdx = -1;
                pausePill.classList.remove('visible');
                endingPromptEl.classList.remove('visible');
                replayBtn.classList.remove('visible');
                RomanticAudio.restart();
                renderFrame(0);
            });

            window.addEventListener('DOMContentLoaded', () => {
                renderFrame(0);
                requestAnimationFrame(animationLoop);
            });
        })();
    </script>
</body>
</html>
